<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Пользователи</title>
    <style>
        body { font-family: sans-serif; margin:0; background:#ecf0f1; }
        main { padding:20px 30px; }
        h2 { color:#2c3e50; margin-top:0; }
        .msg { background:#d4edda; color:#155724; padding:10px 14px;
            border-radius:4px; margin-bottom:15px; }
        table { width:100%; background:white; border-collapse:collapse;
            border-radius:8px; overflow:hidden;
            box-shadow:0 1px 4px rgba(0,0,0,0.08); }
        th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #ecf0f1; }
        th { background:#34495e; color:white; font-size:13px; }
        th a { color:white; text-decoration:none; display:inline-block;
            width:100%; }
        th a:hover { text-decoration:underline; }
        .btn { padding:5px 10px; border:none; border-radius:4px;
            cursor:pointer; color:white; font-size:12px; }
        .btn-del { background:#e74c3c; }
        .btn-view { background:#3498db; text-decoration:none; display:inline-block; }
        .btn-role { background:#f39c12; }
        form { display:inline; }
        select { padding:4px; }
    </style>
</head>
<body>
<div th:replace="fragments :: menu"></div>
<main>
    <h2>Пользователи</h2>
    <div class="msg" th:if="${msg}" th:text="${msg}"></div>
    <table>
        <tr>
            <th>
                <a th:href="@{/users(sort='id', dir=${sort == 'id' and dir == 'asc' ? 'desc' : 'asc'})}">
                    ID <span th:if="${sort == 'id'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/users(sort='username', dir=${sort == 'username' and dir == 'asc' ? 'desc' : 'asc'})}">
                    Имя <span th:if="${sort == 'username'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/users(sort='role', dir=${sort == 'role' and dir == 'asc' ? 'desc' : 'asc'})}">
                    Роль <span th:if="${sort == 'role'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/users(sort='created_at', dir=${sort == 'created_at' and dir == 'asc' ? 'desc' : 'asc'})}">
                    Создан <span th:if="${sort == 'created_at'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>Действия</th>
        </tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">alice</td>
            <td th:text="${u.role}">USER</td>
            <td th:text="${u.created_at}">-</td>
            <td>
                <a th:href="@{/users/{id}/records(id=${u.id})}"
                   class="btn btn-view">Записи</a>

                <form method="post" action="/users/role">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                    <input type="hidden" name="id" th:value="${u.id}"/>
                    <select name="role">
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="BANNED">BANNED</option>
                    </select>
                    <button type="submit" class="btn btn-role">Сменить роль</button>
                </form>

                <form method="post" action="/users/delete"
                      onsubmit="return confirm('Удалить пользователя и все его записи?');">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                    <input type="hidden" name="id" th:value="${u.id}"/>
                    <button type="submit" class="btn btn-del">Удалить</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Рейтинг</title>
    <style>
        body { font-family: sans-serif; margin:0; background:#ecf0f1; }
        main { padding:20px 30px; }
        h2 { color:#2c3e50; margin-top:0; }
        .tabs a { display:inline-block; padding:8px 16px; margin-right:6px;
            border-radius:4px; text-decoration:none;
            background:white; color:#2c3e50; }
        .tabs a.active { background:#3498db; color:white; }
        .tabs { margin-bottom:8px; }
        .tabs-label { color:#7f8c8d; font-size:13px; margin:0 0 4px 2px; }
        .msg { background:#d4edda; color:#155724; padding:10px 14px;
            border-radius:4px; margin:15px 0; }
        table { width:100%; background:white; border-collapse:collapse;
            border-radius:8px; overflow:hidden; margin-top:15px;
            box-shadow:0 1px 4px rgba(0,0,0,0.08); }
        th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #ecf0f1; }
        th { background:#34495e; color:white; font-size:13px; }
        input[type=number] { width:80px; padding:4px; }
        .btn { padding:5px 10px; border:none; border-radius:4px;
            cursor:pointer; color:white; font-size:12px; }
        .btn-save { background:#27ae60; }
        .btn-del { background:#e74c3c; }
        form { display:inline; }
        .clear-form { margin-top:15px; }
    </style>
</head>
<body>
<div th:replace="fragments :: menu"></div>
<main>
    <h2>Рейтинг</h2>

    <div class="tabs-label">Сложность:</div>
    <div class="tabs">
        <a th:href="@{/leaderboard(diff='EASY', mode=${mode})}"
           th:classappend="${diff == 'EASY'} ? 'active'">Новичок</a>
        <a th:href="@{/leaderboard(diff='MEDIUM', mode=${mode})}"
           th:classappend="${diff == 'MEDIUM'} ? 'active'">Любитель</a>
        <a th:href="@{/leaderboard(diff='HARD', mode=${mode})}"
           th:classappend="${diff == 'HARD'} ? 'active'">Профессионал</a>
    </div>

    <div class="tabs-label">Режим:</div>
    <div class="tabs">
        <a th:href="@{/leaderboard(diff=${diff}, mode='ALL')}"
           th:classappend="${mode == 'ALL' or mode == null} ? 'active'">Все режимы</a>
        <a th:href="@{/leaderboard(diff=${diff}, mode='CLASSIC')}"
           th:classappend="${mode == 'CLASSIC'} ? 'active'">Классика</a>
        <a th:href="@{/leaderboard(diff=${diff}, mode='TIMED')}"
           th:classappend="${mode == 'TIMED'} ? 'active'">На время</a>
    </div>

    <div class="msg" th:if="${msg}" th:text="${msg}"></div>

    <table>
        <tr>
            <th>
                <a th:href="@{/leaderboard(diff=${diff}, mode=${mode}, sort='id', dir=${sort == 'id' and dir == 'asc' ? 'desc' : 'asc'})}"
                   style="color:white;text-decoration:none;">
                    ID <span th:if="${sort == 'id'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/leaderboard(diff=${diff}, mode=${mode}, sort='username', dir=${sort == 'username' and dir == 'asc' ? 'desc' : 'asc'})}"
                   style="color:white;text-decoration:none;">
                    Игрок <span th:if="${sort == 'username'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/leaderboard(diff=${diff}, mode=${mode}, sort='mode', dir=${sort == 'mode' and dir == 'asc' ? 'desc' : 'asc'})}"
                   style="color:white;text-decoration:none;">
                    Режим <span th:if="${sort == 'mode'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/leaderboard(diff=${diff}, mode=${mode}, sort='best_time_seconds', dir=${sort == 'best_time_seconds' and dir == 'asc' ? 'desc' : 'asc'})}"
                   style="color:white;text-decoration:none;">
                    Лучшее время <span th:if="${sort == 'best_time_seconds'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/leaderboard(diff=${diff}, mode=${mode}, sort='updated_at', dir=${sort == 'updated_at' and dir == 'asc' ? 'desc' : 'asc'})}"
                   style="color:white;text-decoration:none;">
                    Обновлено <span th:if="${sort == 'updated_at'}" th:text="${dir == 'desc'} ? '▼' : '▲'"></span>
                </a>
            </th>
            <th>Правка</th>
        </tr>
        <tr th:each="e : ${entries}">
            <td th:text="${e.id}">1</td>
            <td th:text="${e.username}">alice</td>
            <td th:text="${e.mode == 'TIMED'} ? 'На время' : 'Классика'">-</td>
            <td>
                <form method="post" action="/leaderboard/update">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                    <input type="hidden" name="id" th:value="${e.id}"/>
                    <input type="hidden" name="diff" th:value="${diff}"/>
                    <input type="hidden" name="mode" th:value="${mode}"/>
                    <input type="number" name="seconds" min="1"
                           th:value="${e.best_time_seconds}"/>
                    <button type="submit" class="btn btn-save">ОК</button>
                </form>
            </td>
            <td th:text="${e.updated_at}">-</td>
            <td>
                <form method="post" action="/leaderboard/delete"
                      onsubmit="return confirm('Удалить запись из рейтинга?');">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                    <input type="hidden" name="id" th:value="${e.id}"/>
                    <input type="hidden" name="diff" th:value="${diff}"/>
                    <input type="hidden" name="mode" th:value="${mode}"/>
                    <button type="submit" class="btn btn-del">Удалить</button>
                </form>
            </td>
        </tr>
    </table>

    <form method="post" action="/leaderboard/clear" class="clear-form"
          onsubmit="return confirm('Очистить рейтинг по выбранному фильтру режима?');">
        <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
        <input type="hidden" name="diff" th:value="${diff}"/>
        <input type="hidden" name="mode" th:value="${mode}"/>
        <button type="submit" class="btn btn-del">
            Очистить <span th:text="${mode == 'ALL' ? 'все режимы' : (mode == 'TIMED' ? 'режим На время' : 'режим Классика')}"></span>
        </button>
    </form>
</main>
</body>
</html>
